<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Selected photography and cinematography work by Vethesnan."
    />
    <link rel="icon" type="image/svg+xml" href="Ellipsde.svg?v=20261122" />
    <title>Vethesnan</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap");

      :root {
        color-scheme: dark;
        --accent: #e10600;
        --page-padding: clamp(1.25rem, 5vw, 5rem);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: #000;
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #000;
        color: #f5f5f5;
        font-family: "Montserrat", "Inter", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .portfolio-section {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        justify-content: center;
        padding: clamp(3.5rem, 9vh, 7rem) var(--page-padding);
      }

      .gallery {
        display: grid;
        width: min(100%, 1500px);
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(1rem, 2.2vw, 2rem);
        margin: 0 auto;
      }

      .portfolio-card {
        min-width: 0;
        transition:
          opacity 0.8s ease-out,
          transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: var(--stagger, 0s);
      }

      html.motion-ready .portfolio-card {
        opacity: 0;
        transform: translateY(30px);
      }

      html.motion-ready .portfolio-card.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .image-frame {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16 / 10;
        border-radius: 5px;
        background: #151515;
      }

      .image-frame::after {
        position: absolute;
        z-index: 1;
        background:
          linear-gradient(135deg, rgba(225, 6, 0, 0.08), transparent 48%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.2), transparent 55%);
        content: "";
        inset: 0;
        pointer-events: none;
      }

      .card-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.82) contrast(1.08) brightness(0.82);
        transform: scale(1);
        transition: transform 1.15s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: var(--stagger, 0s);
      }

      html.motion-ready .card-image {
        transform: scale(1.15);
      }

      html.motion-ready .portfolio-card.is-visible .card-image {
        transform: scale(1);
      }

      .portfolio-card:hover .card-image,
      .portfolio-card:focus-within .card-image {
        transform: scale(1.05);
        transition-delay: 0s;
        transition-duration: 0.6s;
      }

      .pill {
        display: inline-flex;
        max-width: 100%;
        align-items: center;
        margin-top: 0.9rem;
        padding: 0.42rem 0.7rem;
        border: 1px solid rgba(225, 6, 0, 0.82);
        border-radius: 999px;
        color: var(--accent);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        line-height: 1.2;
        text-transform: uppercase;
        transition:
          opacity 0.65s ease-out,
          transform 0.65s ease-out,
          text-shadow 0.65s ease-out,
          box-shadow 0.65s ease-out;
        transition-delay: calc(var(--stagger, 0s) + 0.3s);
      }

      html.motion-ready .pill {
        opacity: 0;
        transform: translateY(8px);
      }

      html.motion-ready .portfolio-card.is-visible .pill {
        box-shadow: 0 0 12px rgba(225, 6, 0, 0.12);
        opacity: 1;
        text-shadow: 0 0 8px rgba(225, 6, 0, 0.38);
        transform: translateY(0);
      }

      .credits {
        margin: clamp(3.5rem, 8vh, 5.5rem) auto 0;
        color: var(--accent);
        font-size: clamp(0.62rem, 1vw, 0.78rem);
        font-weight: 700;
        letter-spacing: 0.16em;
        line-height: 1.9;
        text-align: center;
        text-transform: uppercase;
        transition:
          opacity 0.7s ease-out,
          transform 0.7s ease-out,
          text-shadow 0.7s ease-out;
        transition-delay: 0.3s;
      }

      html.motion-ready .credits {
        opacity: 0;
        transform: translateY(10px);
      }

      html.motion-ready .credits.is-visible {
        opacity: 1;
        text-shadow: 0 0 10px rgba(225, 6, 0, 0.32);
        transform: translateY(0);
      }

      .credits p {
        margin: 0;
      }

      .credits a {
        color: inherit;
        text-decoration: none;
        text-underline-offset: 0.25em;
      }

      .credits a:hover,
      .credits a:focus-visible {
        text-decoration: underline;
      }

      @media (max-width: 700px) {
        .portfolio-section {
          justify-content: flex-start;
          padding-top: 3.5rem;
          padding-bottom: 3.5rem;
        }

        .gallery {
          width: min(100%, 520px);
          grid-template-columns: 1fr;
          gap: 2rem;
        }

        .credits {
          margin-top: 3.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          transition-delay: 0ms !important;
        }

        html.motion-ready .portfolio-card,
        html.motion-ready .credits {
          opacity: 1;
          transform: none;
        }

        html.motion-ready .card-image,
        .portfolio-card:hover .card-image,
        .portfolio-card:focus-within .card-image {
          transform: scale(1);
        }

        html.motion-ready .pill {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="portfolio-section" aria-label="Selected portfolio work">
        <div class="gallery">
          <article class="portfolio-card" data-reveal-card style="--stagger: 0s">
            <div class="image-frame">
              <img
                class="card-image"
                src="https://picsum.photos/id/1011/1200/750"
                alt="Mountain landscape in cinematic light"
                loading="lazy"
              />
            </div>
            <span class="pill">Los Angeles — Photography</span>
          </article>

          <article
            class="portfolio-card"
            data-reveal-card
            style="--stagger: 0.15s"
          >
            <div class="image-frame">
              <img
                class="card-image"
                src="https://picsum.photos/id/1015/1200/750"
                alt="Forest and mountain landscape"
                loading="lazy"
              />
            </div>
            <span class="pill">Utah — Cinematography</span>
          </article>

          <article
            class="portfolio-card"
            data-reveal-card
            style="--stagger: 0.3s"
          >
            <div class="image-frame">
              <img
                class="card-image"
                src="https://picsum.photos/id/1005/1200/750"
                alt="Portrait in soft natural light"
                loading="lazy"
              />
            </div>
            <span class="pill">On Set — Direction</span>
          </article>
        </div>

        <footer class="credits" data-reveal-text>
          <p>© 2026 Vethesnan — Director / Cinematographer</p>
          <p>
            <a href="mailto:inquiry@vethesnan.cinema">
              inquiry@vethesnan.cinema
            </a>
          </p>
        </footer>
      </section>
    </main>

    <script>
      (() => {
        const revealTargets = [
          ...document.querySelectorAll("[data-reveal-card]"),
          ...document.querySelectorAll("[data-reveal-text]"),
        ];
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        if (reduceMotion || !("IntersectionObserver" in window)) {
          revealTargets.forEach((target) => target.classList.add("is-visible"));
          return;
        }

        document.documentElement.classList.add("motion-ready");

        const observer = new IntersectionObserver(
          (entries, currentObserver) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                currentObserver.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.2 },
        );

        revealTargets.forEach((target) => observer.observe(target));
      })();
    </script>
  </body>
</html>
